name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    # Pinned: ubuntu-latest moved to 26.04, which has no Python 3.9 build.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # The oldest version the README promises, and the one Render runs.
        python-version: ["3.9", "3.11"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      # No API keys and no network: the suite runs against the shipped snapshot.
      - run: python -m pytest tests/ -q
